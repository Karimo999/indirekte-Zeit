# Baut die Installer fuer Mac und Windows und veroeffentlicht sie als GitHub-Release.
# Installierte Apps finden das neue Release ueber latest.json und aktualisieren sich selbst.
#
# Neue Version veroeffentlichen:
#   1. "version" in package.json erhoehen (z. B. 1.1.0 -> 1.2.0) und committen
#   2. Tag setzen und pushen:  git tag v1.2.0 && git push origin v1.2.0
#      oder auf GitHub: Actions -> Release -> "Run workflow"
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  vorbereiten:
    name: Prüfen und Release anlegen
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (Rechnung und PDF-Eintragung)
        run: npm test
      - name: Version lesen
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Release als Entwurf anlegen
        id: release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const version = process.env.VERSION;
            const tag = `v${version}`;
            if (context.ref.startsWith('refs/tags/') && context.ref !== `refs/tags/${tag}`) {
              core.setFailed(`Der Tag ${context.ref.replace('refs/tags/', '')} passt nicht zur Version ${version} in package.json.`);
              return;
            }
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const vorhanden = releases.find((r) => r.tag_name === tag);
            if (vorhanden && !vorhanden.draft) {
              core.setFailed(`Version ${version} ist schon veröffentlicht. Bitte die Version in package.json erhöhen.`);
              return;
            }
            if (vorhanden) return vorhanden.id;
            const { data } = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, target_commitish: context.sha,
              name: `Indirekte Zeit ${version}`,
              body: [
                '**Installieren**',
                '- Windows: `…_x64-setup.exe` herunterladen und starten.',
                '- Mac: `…_universal.dmg` öffnen und „Indirekte Zeit“ in den Ordner „Programme“ ziehen.',
                '',
                'Bereits installierte Apps zeigen das Update selbst an.',
              ].join('\n'),
              draft: true,
              prerelease: false,
            });
            return data.id;

  bauen:
    name: Installer ${{ matrix.name }}
    needs: vorbereiten
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            rust_targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.vorbereiten.outputs.release_id }}
          args: ${{ matrix.args }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  veroeffentlichen:
    name: Release veröffentlichen
    needs: [vorbereiten, bauen]
    runs-on: ubuntu-latest
    steps:
      - name: latest.json prüfen und Release freigeben
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.vorbereiten.outputs.release_id }}
          VERSION: ${{ needs.vorbereiten.outputs.version }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.RELEASE_ID);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id, per_page: 100 });
            const json = assets.find((a) => a.name === 'latest.json');
            if (!json) { core.setFailed('latest.json fehlt im Release.'); return; }
            const { data } = await github.rest.repos.getReleaseAsset({ owner, repo, asset_id: json.id, headers: { accept: 'application/octet-stream' } });
            const latest = JSON.parse(Buffer.from(data).toString('utf8'));
            const plattformen = Object.keys(latest.platforms || {});
            core.info(`latest.json: Version ${latest.version}, Plattformen ${plattformen.join(', ')}`);
            for (const p of ['darwin-aarch64', 'darwin-x86_64', 'windows-x86_64']) {
              if (!plattformen.includes(p)) { core.setFailed(`latest.json: Plattform ${p} fehlt.`); return; }
              if (!latest.platforms[p].signature) { core.setFailed(`latest.json: Signatur für ${p} fehlt.`); return; }
            }
            if (latest.version.replace(/^v/, '') !== process.env.VERSION) { core.setFailed('latest.json hat eine falsche Version.'); return; }
            await github.rest.repos.updateRelease({ owner, repo, release_id, draft: false, make_latest: 'true' });
            core.info(`Version ${process.env.VERSION} ist veröffentlicht.`);
